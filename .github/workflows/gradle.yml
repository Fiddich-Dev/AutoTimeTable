name: Build and Deploy



on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Build
      run: ./gradlew clean build

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.IMAGE_NAME }} .  
        
    - name: Save Docker image to archive
      run: |
        docker save ${{ secrets.IMAGE_NAME }} | gzip > ${GITHUB_SHA}.tar.gz
      
    - name: Copy image to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "${{ github.sha }}.tar.gz"
        target: "/home/${{ secrets.EC2_USER }}/"
    
    - name: SSH into EC2 and run container
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 기존 컨테이너 정리
          docker stop ${{ secrets.CONTAINER_NAME }} || true
          docker rm ${{ secrets.CONTAINER_NAME }} || true
          
          # 이미지 로드
          gunzip -f ${{ github.sha }}.tar.gz
          docker load -i ${{ github.sha }}.tar
          
          # .env 파일 생성
          # cat <<EOF > .env
          # DB_URL=${{ secrets.DB_URL }}
          # DB_USERNAME=${{ secrets.DB_USERNAME }}
          # DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          # REDIS_HOST=${{ secrets.REDIS_HOST }}
          # REDIS_PORT=${{ secrets.REDIS_PORT }}
          # SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          # SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          # SMTP_PORT=${{ secrets.SMTP_PORT }}
          # JWT_SECRET=${{ secrets.JWT_SECRET }}
          # CONTAINER_NAME=${{ secrets.CONTAINER_NAME }}
          # IMAGE_NAME=${{ secrets.IMAGE_NAME }}
          # EOF

          # 이미지 실행
          docker run -d \
          --name ${{ secrets.CONTAINER_NAME }} \
          -p 8080:8080 \
          -e DB_URL=${{ secrets.DB_URL }} \
          -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
          -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
          -e REDIS_PORT=${{ secrets.REDIS_PORT }} \
          -e SMTP_USERNAME=${{ secrets.SMTP_USERNAME }} \
          -e SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }} \
          -e SMTP_PORT=${{ secrets.SMTP_PORT }} \
          -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
          ${{ secrets.IMAGE_NAME }}

          # 못쓴느 이미지 삭제
          sudo docker rmi $(sudo docker images -f "dangling=true" -q) --force

          # tar 파일 정리
          rm -f ${{ github.sha }}.tar.gz
          rm -f ${{ github.sha }}.tar
