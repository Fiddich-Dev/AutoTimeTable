name: Build and Deploy



on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Build
      run: ./gradlew clean build --no-build-cache

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.IMAGE_NAME }} . 
        
    - name: Save Docker image to archive
      run: |
        docker save ${{ secrets.IMAGE_NAME }} | gzip > ${GITHUB_SHA}.tar.gz
        
    
    - name: Copy Docker image to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "${{ github.sha }}.tar.gz"
        target: "/home/ubuntu"

    - name: stop and remove container, remove image
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker stop ${{ secrets.CONTAINER_NAME }} || true
          docker rm ${{ secrets.CONTAINER_NAME }} || true
          docker rmi ${{ secrets.IMAGE_NAME }} || true

    
    - name: SSH into EC2 and run container
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          
          # 이미지 로드
          gunzip -f ${{ github.sha }}.tar.gz
          docker load -i ${{ github.sha }}.tar

          
          # .env 파일 생성 (반드시 추가)
          cat <<EOF > .env
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          
          # 이미지 실행
          docker run  --env-file ./.env   -e "SPRING_PROFILES_ACTIVE=prod"   -d -p 8080:8080   --name ${{ secrets.CONTAINER_NAME }}   ${{ secrets.IMAGE_NAME }}
          # redis 네트워크 연결
          docker network connect redis-network ${{ secrets.CONTAINER_NAME }}
          
          #정리 
          rm -f ${{ github.sha }}.tar.gz
          rm -f ${{ github.sha }}.tar
          rm -f .env
