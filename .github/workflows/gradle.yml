name: Build and Deploy



on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Build
      run: ./gradlew clean build

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.IMAGE_NAME }} .  
        
    - name: Save Docker image to archive
      run: |
        docker save ${{ secrets.IMAGE_NAME }} | gzip > ${GITHUB_SHA}.tar.gz
      
    - name: Copy image to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "${{ github.sha }}.tar.gz"
        target: "/home/${{ secrets.EC2_USER }}/"
    
    - name: SSH into EC2 and run container
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 기존 컨테이너 정리 (경고 무시)
          docker stop ${{ secrets.CONTAINER_NAME }} || true
          docker rm ${{ secrets.CONTAINER_NAME }} || true
          docker rmi ${{ secrets.IMAGE_NAME }} || true
          
          # 이미지 로드 및 태그 설정
          gunzip -f ${GITHUB_SHA}.tar.gz
          docker load -i ${GITHUB_SHA}.tar
          docker tag ${GITHUB_SHA} ${{ secrets.IMAGE_NAME }}  # 추가된 부분
          
          # 환경변수 파일 생성 (보안 강화)
          cat <<EOF > .env
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          
          # 컨테이너 실행
          docker run -d \
            --name ${{ secrets.CONTAINER_NAME }} \
            --env-file .env \
            -p 8080:8080 \
            ${{ secrets.IMAGE_NAME }}
          
          # 정리
          rm -f ${GITHUB_SHA}.tar*
          docker image prune -f
          rm -f .env
    
